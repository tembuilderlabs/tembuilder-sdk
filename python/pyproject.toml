[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tembuilder"
version = "0.4.0"
description = "Official Python SDK for the Tembuilder PDF rendering API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Tembuilder" }]
keywords = ["tembuilder", "pdf", "pdf-generation", "templates", "api", "sdk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "attrs>=23.1",
]

[project.urls]
Homepage = "https://tembuilder.com/pdf-generation-api/"
Documentation = "https://tembuilder.com/docs/"
Repository = "https://github.com/tembuilderlabs/tembuilder-sdk"
Issues = "https://github.com/tembuilderlabs/tembuilder-sdk/issues"

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "anyio==4.11.0",
  "ruff==0.14.5",
  "mypy==1.18.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tembuilder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["tembuilder"]
branch = true
# Generated code is verified by drift checks and the shared contract suite.
omit = ["*/tembuilder/_generated/*"]

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "@overload"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/tembuilder/_generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src/tembuilder", "examples"]
mypy_path = "src"
exclude = ["src/tembuilder/_generated/"]

[[tool.mypy.overrides]]
module = "tembuilder._generated.*"
ignore_errors = true
