name: Production smoke test

# Runs the real render flow against production so a backend that drifts from the
# spec is caught even when no SDK change is made: after every production deploy
# of a backend service or the renderer (repository_dispatch from tembuilder-be
# and tembuilder-wa), and nightly for what no deploy touches (expired keys,
# DNS, gateway or infrastructure changes).
on:
  repository_dispatch:
    types: [production-deployed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Several services usually deploy together; only the latest run matters.
concurrency:
  group: production-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Latest ${{ matrix.sdk }} from its registry
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        sdk: [node, python, go]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.sdk == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: matrix.sdk == 'python'
        uses: astral-sh/setup-uv@v6
      - if: matrix.sdk == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: stable
      # What users install today, against production: catches a backend that
      # drifts from the spec even when no SDK change is made.
      - run: ./e2e/run.sh "${{ matrix.sdk }}" latest
        env:
          REQUIRE_LIVE: "1"
          TEMBUILDER_API_KEY: ${{ secrets.SMOKE_API_KEY }}
          TEMBUILDER_BASE_URL: ${{ vars.SMOKE_BASE_URL }}
          TEMBUILDER_SMOKE_TEMPLATE: ${{ vars.SMOKE_TEMPLATE }}
